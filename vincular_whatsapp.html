<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Escanear QR - AthenaBall Producción</title>
    <!-- Incluir biblioteca moderna para QR (qr-code-styling) -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
    <style>
        :root {
            --primary: #00eaff;
            --secondary: #0066ff;
            --bg-dark: #050f19;
            --glass-bg: rgba(0, 40, 60, 0.4);
            --glass-border: rgba(0, 234, 255, 0.3);
            --text-light: #e0f7fa;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0a1929 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 234, 255, 0.05);
            max-width: 450px;
            width: 100%;
            transition: all 0.4s ease;
        }

        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        p {
            color: #a0c4d8;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        #qr-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            background-color: white;
            padding: 15px;
            border-radius: 20px;
            width: 320px;
            height: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(255,255,255,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #qr-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .status-badge.loading { color: #ffd700; border-color: rgba(255, 215, 0, 0.3); }
        .status-badge.success { color: #00ff88; border-color: rgba(0, 255, 136, 0.3); background: rgba(0, 255, 136, 0.1); }
        .status-badge.error { color: #ff5555; border-color: rgba(255, 85, 85, 0.3); }
        .status-badge.ready { color: var(--primary); border-color: var(--glass-border); }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Effects */
        .glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.3;
            z-index: 1;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .pulse {
            animation: pulse-glow 2s infinite;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 234, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 234, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 234, 255, 0); }
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="container">
        <div class="card">
            <h2>🔗 Vinculación WhatsApp</h2>
            <p>Conecta tu dispositivo para habilitar las notificaciones automáticas de AthenaBall en el servidor de producción.</p>
            
            <div id="status-badge" class="status-badge loading">
                <div class="spinner" id="spinner"></div>
                <span id="status-text">Iniciando conexión...</span>
            </div>
            
            <div id="qr-wrapper">
                <div id="qr-container"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://baloncestoholistico.onrender.com/api/whatsapp-status';
        let currentQRStr = null;

        // Configuración Profesional del QR usando qr-code-styling pero con bloques estándar
        const qrCode = new QRCodeStyling({
            width: 320,
            height: 320,
            type: "svg", // Renderiza en SVG para máxima nitidez (resolución infinita)
            data: "https://athenaball.com", // Placeholder inicial
            margin: 10, // Margen blanco crítico
            qrOptions: {
                typeNumber: 0,
                mode: "Byte",
                errorCorrectionLevel: "M" // Nivel M es el estándar más compatible
            },
            imageOptions: {
                hideBackgroundDots: false, // Mejor desactivar esto por si afecta
                imageSize: 0.1,
                margin: 0,
                crossOrigin: "anonymous",
            },
            dotsOptions: {
                color: "#000000", // Negro sólido tradicional y de más alto contraste
                type: "square" // Cuadrados estrictos (WhatsApp suele rechazar los redondos)
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            cornersSquareOptions: {
                color: "#000000",
                type: "square" // Cuadrado perfecto tradicional
            },
            cornersDotOptions: {
                color: "#000000",
                type: "square" // Cuadrado perfecto tradicional
            }
        });

        // Inicializar el QR vacío en el contenedor
        qrCode.append(document.getElementById("qr-container"));

        async function fetchQR() {
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('spinner');

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if (data.ready) {
                    statusBadge.className = "status-badge success pulse";
                    statusText.innerText = "¡Conectado exitosamente! Listo en Producción.";
                    spinner.style.display = "none";
                    document.getElementById('qr-wrapper').innerHTML = `<h1 style="color: #00a884; font-size: 5rem; margin: 0;">✅</h1>`;
                    currentQRStr = null;
                    return;
                }

                if (data.qr && data.qr.trim() !== "") {
                    // Solo actualizamos el dibujo si la data realmente cambió
                    if (data.qr !== currentQRStr) {
                        qrCode.update({
                            data: data.qr
                        });
                        currentQRStr = data.qr;
                        
                        statusBadge.className = "status-badge ready";
                        statusText.innerText = "QR Listo. Escanéalo en WhatsApp.";
                        spinner.style.display = "none";
                        document.getElementById('qr-wrapper').classList.add('pulse');
                    }
                } else {
                    statusBadge.className = "status-badge loading";
                    statusText.innerText = "Esperando generación del código...";
                    spinner.style.display = "block";
                    document.getElementById('qr-wrapper').classList.remove('pulse');
                }

            } catch (err) {
                statusBadge.className = "status-badge error";
                statusText.innerText = "Fallo de red. Reintentando...";
                spinner.style.display = "none";
                document.getElementById('qr-wrapper').classList.remove('pulse');
                console.error("Error fetching QR:", err);
            }
        }

        // Consultar de inmediato y luego cada 5 segundos para mantenerlo sincronizado sin parpadeos visuales
        fetchQR();
        setInterval(fetchQR, 5000);
    </script>
</body>
</html>
